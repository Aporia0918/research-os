# Android test build: a debug APK of apps/mobile on a GitHub-hosted runner (it has the Android SDK and JDK 17).
# Every build is signed with the one debug-only key in the repo (android/app/debug-ci.keystore) and numbered
# 100 + run number, so each APK installs over the last. On integrate/whole-app it also replaces the rolling
# 「测试版」 pre-release (tag test-latest) with this APK and its version.json; the test app checks that page.
# The owner agreed to publish test pre-releases on 2026-11-17. No stable release, never master.
name: android-debug

on:
  workflow_dispatch:
  push:
    branches: ["feat/mobile-apk-ci", "integrate/whole-app", "claude/**"]  # claude/**: artifact only, never published

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Build the 析微 engine (Pyodide + pinned wheels) and run it once in Node
        # 17 MB of WebAssembly Python and wheels, so it is built here and never committed (public/engine is ignored).
        run: |
          set -eu
          python3 ../../packages/xiwei/build_site.py "$RUNNER_TEMP/engine"
          node ../../packages/xiwei/smoke.mjs "$RUNNER_TEMP/engine"
          cp -r "$RUNNER_TEMP/engine" public/engine

      - name: Build the web app and copy it into the Android project
        run: |
          set -eu
          export VITE_TEST_BUILD=1 VITE_VERSION_CODE=$((100 + VERSION_CODE))
          npm ci && npm run build && npx cap sync android

      - name: 析微 main line in Chrome (the built Web Worker loads the engine)
        run: |
          npm i --no-save playwright-core@1.49.1
          node scripts/xiwei-browser-smoke.mjs

      - name: Build the debug APK
        # The wrapper jar is not in the repo, so fetch the Gradle version the wrapper names and run it directly.
        working-directory: apps/mobile/android
        run: |
          set -eu
          export JAVA_HOME="$JAVA_HOME_17_X64"
          v=$(sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$v-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-$v/bin/gradle" --no-daemon assembleDebug

      - name: Check the APK carries the 账账 launcher icon
        # A res file in another source set (src/debug/res) silently wins over src/main/res; 1.4.112 and 1.4.113
        # shipped the old icon that way. Each icon layer in the APK must be byte-identical to src/main/res.
        run: |
          set -eu
          apk=android/app/build/outputs/apk/debug/app-debug.apk; res=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground ic_launcher_background; do
              unzip -p "$apk" "res/mipmap-$d-v4/$f.png" | cmp - "$res/mipmap-$d/$f.png"
            done
          done
          echo "launcher icon in the APK matches src/main/res"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: researchos-mobile-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish the 测试版 (test-builds branch and tb tag for jsDelivr, then the GitHub pre-release)
        # GitHub downloads are often unreachable from mainland China, so each test build also goes on the orphan
        # branch test-builds (one APK, one version.json, history replaced every time) that jsDelivr serves from
        # several CDNs. version.json lists the jsDelivr copies first (pinned to the APK's commit) and GitHub last;
        # the app tries them in order and checks size and sha256 whichever one answers.
        if: github.ref == 'refs/heads/integrate/whole-app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          code=$((100 + VERSION_CODE))
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          apk="researchos-test-$code.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$out/$apk"
          sha=$(sha256sum "$out/$apk" | cut -d' ' -f1); size=$(stat -c %s "$out/$apk")

          tb="$RUNNER_TEMP/test-builds"; git init -q -b test-builds "$tb"; cp "$out/$apk" "$tb/"
          git -C "$tb" config user.name "github-actions[bot]"
          git -C "$tb" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tb" add "$apk"; git -C "$tb" commit -qm "测试版 1.4.$code"
          pin=$(git -C "$tb" rev-parse HEAD)
          gh_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/test-latest/$apk"
          jq -n --arg name "1.4.$code" --argjson code "$code" --arg sha "$sha" --argjson size "$size" \
            --arg gh "$gh_url" --arg cdn "${GITHUB_REPOSITORY}@$pin/$apk" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg short "${GITHUB_SHA::7}" \
            '{versionName:$name, versionCode:$code, minSupportedVersionCode:1, sha256:$sha, size:$size,
              apk:(([["gcore",10],["fastly",20],["cdn",30]] | map({url:("https://" + .[0] + ".jsdelivr.net/gh/" + $cdn), priority:.[1]}))
                  + [{url:$gh, priority:40}]),
              releaseNotes:("测试版 " + $name + "（" + $short + "）"), publishedAt:$at, channel:"test"}' > "$out/version.json"
          cp "$out/version.json" "$tb/"; git -C "$tb" add version.json; git -C "$tb" commit -qm "测试版 1.4.$code version.json"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$tb" push -qf "$remote" test-builds
          # A tag per build (tb-<code>) on a commit holding only version.json: an address that never changes, so no
          # jsDelivr cache can hide it (the branch copy above stayed on an old build for hours). Keep the last ten.
          vj="$RUNNER_TEMP/tag"; git init -q -b tag "$vj"; cp "$out/version.json" "$vj/"
          git -C "$vj" config user.name "github-actions[bot]"
          git -C "$vj" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$vj" add version.json; git -C "$vj" commit -qm "测试版 1.4.$code version.json"; git -C "$vj" tag "tb-$code"
          git -C "$vj" push -q "$remote" "tb-$code"
          git -C "$vj" push -q "$remote" --delete "tb-$((code - 10))" 2>/dev/null || true

          gh release delete test-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create test-latest "$out/$apk" "$out/version.json" --prerelease --target "$GITHUB_SHA" \
            --title "测试版 1.4.$code" --notes "思维账本测试版，自动打包，未在真机验证。装好后 App 会自己检查这里有没有新版。国内下载慢可以用 version.json 里的 jsDelivr 地址。"
          # jsDelivr keeps a branch's files cached for hours; ask it to drop the old version.json (free, no account).
          curl -sS -m 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@test-builds/version.json" -o /dev/null -w "purge %{http_code}\n" || true

      - name: Check the published APK with the app's own update download code
        # Runs UpdateDownload.java on the runner's JVM against every mirror in the version.json just published:
        # GitHub must pass (full check, including wrong size/sha being caught); a jsDelivr copy that fails is a warning.
        if: github.ref == 'refs/heads/integrate/whole-app'
        run: |
          set -eu
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          v="$RUNNER_TEMP/release/version.json"; d="$RUNNER_TEMP/update-check"
          javac -d "$d" android/app/src/main/java/dev/paperlab/assistant/UpdateDownload.java \
            scripts/update-check/UpdateDownloadCheck.java
          java -cp "$d" dev.paperlab.assistant.UpdateDownloadCheck \
            "$(jq -r '.apk[-1].url' "$v")" "$(jq -r .size "$v")" "$(jq -r .sha256 "$v")" \
            $(jq -r '.apk[:-1][].url' "$v")
          code=$(jq -r .versionCode "$v")
          for h in gcore fastly; do
            got=$(curl -sS -m 30 "https://$h.jsdelivr.net/gh/${GITHUB_REPOSITORY}@tb-$code/version.json" | jq -r .versionCode 2>/dev/null || echo none)
            [ "$got" = "$code" ] && echo "ok   $h.jsdelivr.net tb-$code/version.json is $got" \
              || { echo "::error::$h.jsdelivr.net tb-$code/version.json is $got, not $code"; exit 1; }
          done

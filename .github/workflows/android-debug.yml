# Android test build: a debug APK of apps/mobile on a GitHub-hosted runner (it has the Android SDK and JDK 17).
# Artifacts only: no release, no tag, no signing secrets (debug builds use the runner's throwaway debug key).
name: android-debug

on:
  workflow_dispatch:
  push:
    branches: ["feat/mobile-apk-ci"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Build the web app and copy it into the Android project
        run: npm ci && npm run build && npx cap sync android

      - name: Build the debug APK
        # The wrapper jar is not in the repo, so fetch the Gradle version the wrapper names and run it directly.
        working-directory: apps/mobile/android
        run: |
          set -eu
          export JAVA_HOME="$JAVA_HOME_17_X64"
          v=$(sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$v-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-$v/bin/gradle" --no-daemon assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: researchos-mobile-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
